{% extends 'base.html' %}
{% load static %}

{% block title %}PyOrganiza - Importar Extrato{% endblock title %}

{% block content %}
{% load crispy_forms_tags %}

<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-8">
            <!-- Header -->
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                        <i class="bi bi-upload text-primary fs-5"></i>
                    </div>
                    <div>
                        <h1 class="h4 fw-bold mb-0">Importar Extrato</h1>
                        <p class="text-muted small mb-0">Faça upload do arquivo OFX do seu banco</p>
                    </div>
                </div>
               <a href="{% url 'import-reconciliation' %}" class="btn btn-success shadow">
                    <i class="bi bi-arrow-left me-2"></i>Ir para Conciliação
                </a>
            </div>

            <div class="card shadow">
                <div class="card-body p-4">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary w-100 mt-3">
                            <i class="bi bi-upload me-2"></i>Importar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
